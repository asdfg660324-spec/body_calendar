name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, release ]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        run: |
          flutter build ipa --release --no-codesign \
            --build-name="${GITHUB_RUN_NUMBER}.0.0" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=SUPABASE_REDIRECT_URL=bodycalendar://login-callback/

      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/unsigned_ipa
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
            build/ios/unsigned_ipa/Payload/BodyCalendar.app
          mkdir -p build/ios/ipa
          cd build/ios/unsigned_ipa
          zip -qry ../ipa/body_calendar_unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: body-calendar-ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
